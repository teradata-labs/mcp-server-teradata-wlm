[project]
name = "tdwm-mcp"
version = "0.1.0"
description = "Teradata Workload Management MCP Server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "mcp[cli]>=1.28.1",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.2",
    "teradatasql>=20.0.0.44",
    "uvicorn>=0.38.0",
    "starlette>=0.49.0",
    "aiohttp>=3.13.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "authlib>=1.6.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.21.0",
    "orjson>=3.11.0",
]

[[project.authors]]
name = "Artur Borycki"
email = "artur.borycki@gmail.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tdwm-mcp = "tdwm_mcp:main"
