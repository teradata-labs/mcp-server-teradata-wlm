version: "3.8"

services:
  tdwm-mcp:
    build: .
    container_name: tdwm-mcp-oauth
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - DATABASE_URI=${DATABASE_URI:?Set DATABASE_URI in .env or environment}
      # Authentication mechanism: TD2, LDAP, KRB5, TDNEGO, JWT
      - DB_LOGMECH=${DB_LOGMECH:-TD2}
      - DB_LOGDATA=${DB_LOGDATA:-}
      - DB_SSL_MODE=${DB_SSL_MODE:-}
      - DB_ENCRYPT_DATA=${DB_ENCRYPT_DATA:-true}
      # Connection resilience settings
      - DB_MAX_RETRIES=${DB_MAX_RETRIES:-3}
      - DB_INITIAL_BACKOFF=${DB_INITIAL_BACKOFF:-1.0}
      - DB_MAX_BACKOFF=${DB_MAX_BACKOFF:-30.0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # OAuth 2.1 Configuration (ENABLED)
      - OAUTH_ENABLED=true
      - KEYCLOAK_URL=${KEYCLOAK_URL:?Set KEYCLOAK_URL in .env or environment}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:?Set KEYCLOAK_REALM in .env or environment}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-tdwm-mcp}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - OAUTH_RESOURCE_SERVER_URL=${OAUTH_RESOURCE_SERVER_URL:?Set OAUTH_RESOURCE_SERVER_URL in .env or environment}
      - OAUTH_REQUIRED_SCOPES=${OAUTH_REQUIRED_SCOPES:-tdwm:read,tdwm:monitor}
      - OAUTH_VALIDATE_AUDIENCE=${OAUTH_VALIDATE_AUDIENCE:-true}
      - OAUTH_VALIDATE_SCOPES=${OAUTH_VALIDATE_SCOPES:-true}
      - OAUTH_REQUIRE_HTTPS=${OAUTH_REQUIRE_HTTPS:-true}
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - tdwm-oauth

  # Optional: Include Keycloak for development/testing
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.4
    container_name: keycloak-tdwm-dev
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      - KC_HTTP_PORT=8080
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
    ports:
      - "8080:8080"
    command: start-dev
    networks:
      - tdwm-oauth

networks:
  tdwm-oauth:
    driver: bridge